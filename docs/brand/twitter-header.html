<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1500px; height: 500px; overflow: hidden; }
  .banner {
    position: relative;
    width: 1500px; height: 500px;
    background:
      radial-gradient(1100px 700px at 22% 30%, #0e2b1b 0%, rgba(14,43,27,0) 60%),
      radial-gradient(900px 600px at 88% 85%, #0c2417 0%, rgba(12,36,23,0) 55%),
      linear-gradient(135deg, #07130c 0%, #0a1c12 55%, #081710 100%);
    font-family: "DejaVu Sans", sans-serif;
    color: #e9f5ee;
  }
  svg.pitch { position: absolute; inset: 0; }
  .content { position: absolute; left: 96px; top: 118px; }
  .kicker {
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 20px; letter-spacing: 4px;
    color: #6fa287;
  }
  .wordmark {
    margin-top: 14px;
    font-family: "DejaVu Sans Mono", monospace;
    font-weight: bold; font-size: 92px; letter-spacing: -2px;
    color: #f4fbf7;
  }
  .wordmark .accent { color: #4ade80; }
  .cursor {
    display: inline-block; width: 40px; height: 72px;
    background: #4ade80; margin-left: 14px; vertical-align: baseline;
    box-shadow: 0 0 24px rgba(74, 222, 128, .55);
  }
  .tagline { margin-top: 22px; font-size: 30px; color: #cfe6d9; }
  .tagline b { color: #ffffff; font-weight: 600; }
  .trio {
    margin-top: 26px;
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 21px; color: #8fc7a8; letter-spacing: .5px;
  }
  .trio .gt { color: #4ade80; font-weight: bold; }
  .trio .dot { color: #3f6b53; margin: 0 10px; }
  .season {
    position: absolute; right: 96px; bottom: 40px;
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 19px; color: #6fa287; letter-spacing: 2px;
  }
  .season b { color: #a7dcc0; font-weight: normal; }
  /* the differential scatter, right side */
  .plot { position: absolute; right: 92px; top: 84px; }
  .plot-label {
    position: absolute; font-family: "DejaVu Sans Mono", monospace;
    font-size: 15px; color: #5d8a70;
  }
</style>
</head>
<body>
<div class="banner">

  <!-- faint pitch geometry across the whole banner -->
  <svg class="pitch" width="1500" height="500" viewBox="0 0 1500 500">
    <g stroke="#9edfba" stroke-width="2" fill="none" opacity="0.055">
      <rect x="60" y="-140" width="1380" height="780" rx="4"/>
      <line x1="750" y1="-140" x2="750" y2="640"/>
      <circle cx="750" cy="250" r="150"/>
      <circle cx="750" cy="250" r="6" fill="#9edfba"/>
      <rect x="60" y="30" width="240" height="440"/>
      <rect x="60" y="140" width="90" height="220"/>
      <rect x="1200" y="30" width="240" height="440"/>
      <rect x="1350" y="140" width="90" height="220"/>
    </g>
  </svg>

  <!-- ownership vs value scatter: the market vs us -->
  <div class="plot">
    <svg width="360" height="330" viewBox="0 0 360 330">
      <g stroke="#2c4f3b" stroke-width="1.5">
        <line x1="40" y1="10" x2="40" y2="290"/>
        <line x1="40" y1="290" x2="350" y2="290"/>
      </g>
      <!-- the crowd -->
      <g fill="#4a7259" opacity="0.75">
        <circle cx="290" cy="120" r="7"/>
        <circle cx="315" cy="150" r="9"/>
        <circle cx="255" cy="180" r="6"/>
        <circle cx="280" cy="205" r="8"/>
        <circle cx="225" cy="150" r="5"/>
        <circle cx="200" cy="215" r="7"/>
        <circle cx="160" cy="235" r="6"/>
        <circle cx="130" cy="200" r="5"/>
        <circle cx="245" cy="95"  r="5"/>
        <circle cx="115" cy="255" r="6"/>
        <circle cx="90"  cy="230" r="4"/>
        <circle cx="185" cy="170" r="5"/>
      </g>
      <!-- the differential -->
      <g>
        <line x1="78" y1="10"  x2="78"  y2="290" stroke="#4ade80" stroke-width="1" opacity="0.35" stroke-dasharray="4 5"/>
        <line x1="40" y1="62" x2="350" y2="62" stroke="#4ade80" stroke-width="1" opacity="0.35" stroke-dasharray="4 5"/>
        <circle cx="78" cy="62" r="11" fill="#4ade80"/>
        <circle cx="78" cy="62" r="19" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.5"/>
      </g>
    </svg>
    <div class="plot-label" style="left: 118px; top: 36px; color:#7ee2a8;">the differential</div>
    <div class="plot-label" style="right: 4px; top: 300px;">ownership %</div>
    <div class="plot-label" style="left: -20px; top: -4px;">xPts/£m</div>
  </div>

  <div class="content">
    <div class="kicker">MONEYBALL FOR FANTASY PREMIER LEAGUE</div>
    <div class="wordmark">fpl<span class="accent">-</span>claude<span class="cursor"></span></div>
    <div class="tagline">An AI manages the whole season. <b>Models propose, Claude disposes.</b></div>
    <div class="trio">
      value <span class="gt">&gt;</span> reputation
      <span class="dot">·</span> minutes <span class="gt">&gt;</span> hype
      <span class="dot">·</span> process <span class="gt">&gt;</span> outcome
    </div>
  </div>

  <div class="season">2026/27 <b>· building in public</b></div>
</div>
</body>
</html>

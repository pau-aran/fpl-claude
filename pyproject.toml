[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-claude"
version = "0.1.0"
description = "Moneyball for FPL: a Claude-managed Fantasy Premier League team (2026/27)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "duckdb>=0.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 2+ (models) and Phase 3 (optimizer) — install when those phases start.
# penaltyblog (team model) is NOT listed because its PyPI metadata pins a broken
# `socks` package; install it manually instead:
#   pip install penaltyblog --no-deps
#   pip install scipy tqdm pulp networkx matplotlib plotly ipywidgets
# models/team.py imports it lazily and falls back to FDR expectations if absent.
models = ["lightgbm>=4.0", "scikit-learn>=1.4", "scipy>=1.11", "tqdm"]
optimize = ["pulp>=3.3", "highspy>=1.7"]  # >=3.3 for the PuLP-4.0-safe variable API
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

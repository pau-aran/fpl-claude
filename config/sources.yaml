# Curated sources for news sweeps, team-week reports, and strategy consensus.
# Skills reach these via WebSearch/WebFetch. X/Twitter content is reached via web
# search (e.g. searching `site:x.com <account> <topic>` or the account name + topic)
# — there is NO paid X API dependency.
#
# Tier meaning: 1 = check every sweep · 2 = check pre-deadline and weekly · 3 = as needed.

official:
  - {name: "FPL official site news", url: "https://fantasy.premierleague.com", tier: 1,
     use: "player status flags, prices, deadlines — also via API"}
  - {name: "Premier League news", url: "https://www.premierleague.com/news", tier: 2,
     use: "official club/league announcements"}
  - {name: "UEFA fixtures/results", url: "https://www.uefa.com", tier: 2,
     use: "UCL/UEL/UECL schedules for congestion tracking"}

injuries_and_team_news:
  - {name: "Premier Injuries", url: "https://www.premierinjuries.com", tier: 1,
     use: "injury table + return dates; the standard tracker"}
  - {name: "Fantasy Football Scout team news", url: "https://www.fantasyfootballscout.co.uk", tier: 1,
     use: "aggregated press-conference notes, predicted lineups"}
  - {name: "BBC Sport football", url: "https://www.bbc.com/sport/football", tier: 2,
     use: "match reports incl. cups/Europe, injury reporting"}
  - {name: "Sky Sports PL news", url: "https://www.skysports.com/premier-league-news", tier: 2,
     use: "press conferences, transfer/injury news"}

underlying_stats:
  - {name: "xG Stat", url: "https://xgstat.com", tier: 1,
     use: "the live-season advanced-stats reference: FBref killed its advanced feed Jan 2026, xgstat is the community's replacement — verify coverage at season launch"}
  - {name: "Understat", url: "https://understat.com", tier: 1,
     use: "free per-shot xG/xA, JSON embedded in page (scrapable) — core layer alongside the official API"}
  - {name: "FBref Premier League", url: "https://fbref.com/en/comps/9/Premier-League-Stats", tier: 3,
     use: "HISTORICAL ONLY (advanced-stats feed dead since Jan 2026): pre-2026 Opta xG/xA/npxG, per-90s, PSxG for backtests/priors"}

strategy_and_analytics:
  - {name: "Fantasy Football Scout", url: "https://www.fantasyfootballscout.co.uk", tier: 1,
     use: "the reference strategy site: articles, stats, community"}
  - {name: "LiveFPL", url: "https://www.livefpl.net", tier: 2,
     use: "live ranks, effective ownership, template composition — AND the de facto standard for price rise/fall predictions (replaced FPL Statistics)"}
  - {name: "r/FantasyPL", url: "https://www.reddit.com/r/FantasyPL", tier: 2,
     use: "community consensus, team-news sentiment, rotation eye-test, captaincy polls; PRAW (Reddit API) available for programmatic pulls"}
  - {name: "Fantasy Football Hub", url: "https://www.fantasyfootballhub.co.uk", tier: 3,
     use: "projections, articles"}
  - {name: "FPL Review", url: "https://fplreview.com", tier: 3,
     use: "the benchmark projection service (paid tiers); sanity-check our xPts"}
  - {name: "The Athletic FPL coverage", url: "https://www.nytimes.com/athletic", tier: 3,
     use: "deeper tactical/rotation reporting"}

x_accounts:   # reached via web search, never a paid API — vetted July 2026 vs 2025/26 season
  # X = last-mile team-news breakers / set-piece-order changes, never core pipeline.
  # X API is paid + rate-limited; scraping is fragile/ToS-risky. If live-season news
  # SPEED becomes the bottleneck, upgrade path = RSS/Discord relays of verified beat
  # reporters, not the X API (owner note, 2026-07-22).
  # --- data / official / speed (mechanical inputs) ---
  - {handle: "OfficialFPL", tier: 1, use: "official announcements, price changes, deadlines"}
  - {handle: "FPLStatus", tier: 1, use: "automated flag/status alerts, confirmed lineups, provisional bonus, price changes — fastest mechanical feed"}
  - {handle: "BenCrellin", tier: 1, use: "THE fixture-planning authority: DGW/BGW projections; also an elite manager (all-time #1 overall)"}
  - {handle: "FFScout_", tier: 1, use: "Fantasy Football Scout feed: presser aggregation, predicted lineups, deadline articles"}
  - {handle: "FPLPriceChanges", tier: 2, use: "nightly predicted price rises/falls (LiveFPL-powered) — feeds the price-change radar"}
  - {handle: "theFPLkiwi", tier: 2, use: "open xPts/xMins projection model, npxG/finishing analysis — best public model to sanity-check ours"}
  - {handle: "LiveFPL", tier: 2, use: "effective ownership, top-10k template composition, rank analytics"}
  - {handle: "FPL_Rockstar", tier: 2, use: "deadline-day only: earliest reliable lineup leaks ('the OG of team leaks'); 7x top-40k"}
  # --- strategy with transparent reasoning ---
  - {handle: "LetsTalk_FPL", tier: 1, use: "Andy: full decision reasoning every GW; 588th overall 2025/26, 3x top-10k in last 6 seasons — the strategy benchmark"}
  - {handle: "FPL_Harry", tier: 2, use: "deadline decision threads with reasoning; 5 straight top-10k finishes before 2025/26"}
  - {handle: "FPL_Heisenberg", tier: 2, use: "Wes Prickett (BBC Sport FPL expert): talking-point analysis; 7x top-30k, best 836th"}
  - {handle: "allaboutfpl", tier: 3, use: "presser-update aggregation, captain-metrics and wildcard-draft articles"}
  # --- elite-manager transparency (their moves + why) ---
  - {handle: "FPL_Salah", tier: 2, use: "Abdul Rehman: posts his own team/transfer plans with reasoning; consistent elite ranks, FFHub reveal contributor"}
  - {handle: "BigManBakar", tier: 2, use: "posts own team with reasoning; 4th in the world 2024/25"}
  - {handle: "FPLGeneral", tier: 3, use: "FFScout trusted veteran (multiple top-500s); weekly team reveal + transfer plans = template proxy"}
  - {handle: "FplRichard", tier: 3, use: "FPL Review author commentary — solver-adjacent thinking"}
  - {handle: "robtFPL", tier: 3, use: "betting spread-market data graphics — market-implied goals/cards signal"}
  # Dropped after vetting (2025/26): FPLFamily, FPLMate, FPLHints (activity/decision-grade
  # content unverified); AlwaysCheating (podcast wound down its run May 2025).
  # Club beat reporters resolved per-team at sweep time (search "<club> team news x.com").

congestion_competitions:   # competitions that affect PL rotation — track all of them
  - "Premier League"
  - "UEFA Champions League"
  - "UEFA Europa League"
  - "UEFA Conference League"
  - "FA Cup"
  - "EFL Cup (Carabao)"
  - "FIFA Club World Cup (if applicable)"

datasets:
  - {name: "FPL-Core-Insights", url: "https://github.com/olbauday/FPL-Core-Insights",
     use: "actively updated FPL dataset: match stats + Club Elo, FPL-ID-keyed"}
  - {name: "vaastav/Fantasy-Premier-League", url: "https://github.com/vaastav/Fantasy-Premier-League",
     use: "historical per-GW data 2016-17 → 2024-25 (training/backtests)"}
  - {name: "football-data.co.uk", url: "https://www.football-data.co.uk/englandm.php",
     use: "odds CSVs for market signal"}
  - {name: "football-data.org", url: "https://www.football-data.org",
     use: "free-tier API for UCL/cup fixtures (congestion tracking)"}
